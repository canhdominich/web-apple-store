services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", " /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: AppleStore.Web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      VnPaySettings__TmnCode: ${VnPaySettings__TmnCode}
      VnPaySettings__HashSecret: ${VnPaySettings__HashSecret}
      VnPaySettings__BaseUrl: ${VnPaySettings__BaseUrl}
      VnPaySettings__ReturnUrl: ${VnPaySettings__ReturnUrl}
    ports:
      - "5000:8080"
    volumes:
      - product_images:/app/wwwroot/images/products
volumes:
  mssql_data:
  product_images:
